<nav class="app-navbar">

  <div class="app-navbar__left">

    <div class="app-navbar__logo-mark" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <rect x="2" y="1" width="11" height="13" rx="2" class="app-navbar__logo-paper"/>
        <line x1="4.5" y1="5"   x2="10.5" y2="5"   class="app-navbar__logo-line"/>
        <line x1="4.5" y1="7.5" x2="9"    y2="7.5" class="app-navbar__logo-line"/>
        <line x1="4.5" y1="10"  x2="10"   y2="10"  class="app-navbar__logo-line"/>
      </svg>
    </div>

    <span class="app-navbar__brand">
      Cart<span class="app-navbar__brand-accent">IQ</span>
    </span>

    <div class="app-navbar__links">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="nav-link--active" class="app-navbar__link">
          {{ link.label }}
        </a>
      }
    </div>

  </div>

  <div class="app-navbar__right">

    <button mat-icon-button class="app-navbar__avatar" aria-label="Current user initials">
      JD
    </button>

  </div>

</nav>
